<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" viewBox="0 0 760 408"><rect width="760" height="408" rx="10" fill="#1a1a19"/><text x="24.0" y="34.0" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#ffffff" text-anchor="start" font-weight="bold" >One sample</text><text x="24.0" y="58.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#8f8e86" text-anchor="start" font-weight="normal" >the counter interrupts the CPU; the kernel writes a record and returns</text><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c3c2b7"/></marker></defs><rect x="34.7" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="126.7" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >the program</text><line x1="126.7" y1="100" x2="126.7" y2="360" stroke="#2e2e2b" stroke-width="2"/><rect x="288.0" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="380.0" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >the kernel</text><line x1="380.0" y1="100" x2="380.0" y2="360" stroke="#2e2e2b" stroke-width="2"/><rect x="541.3" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="633.3" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >perf</text><line x1="633.3" y1="100" x2="633.3" y2="360" stroke="#2e2e2b" stroke-width="2"/><line x1="129.7" y1="134" x2="376.0" y2="134" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="126.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">the cycle counter overflows: interrupt</text><rect x="215.0" y="156" width="330.0" height="27" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/><text x="380.0" y="174.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="normal" >40-byte record into the ring buffer</text><line x1="377.0" y1="214" x2="130.7" y2="214" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="206.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">resume where it was</text><line x1="24" y1="248" x2="736" y2="248" stroke="#8f8e86" stroke-width="1" stroke-dasharray="3 5"/><text x="380.0" y="242.0" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#8f8e86" text-anchor="middle" font-weight="normal" >... a few thousand samples later ...</text><line x1="383.0" y1="294" x2="629.3" y2="294" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="286.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">buffer filling up: wake perf</text><rect x="547.5" y="316" width="171.6" height="27" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/><text x="633.3" y="334.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="normal" >copy to perf.data</text><text x="24.0" y="392.0" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#8f8e86" text-anchor="start" font-weight="normal" >no other process is woken for a sample: this is why it is cheap where a ptrace stop is not</text></svg>