<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528"><rect width="760" height="528" rx="10" fill="#1a1a19"/><text x="24.0" y="34.0" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#ffffff" text-anchor="start" font-weight="bold" >One hit of a ptrace breakpoint</text><text x="24.0" y="58.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#8f8e86" text-anchor="start" font-weight="normal" >time runs downward; every arrow that reaches the tracer is a switch between processes</text><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c3c2b7"/></marker></defs><rect x="34.7" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="126.7" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >the program</text><line x1="126.7" y1="100" x2="126.7" y2="480" stroke="#2e2e2b" stroke-width="2"/><rect x="288.0" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="380.0" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >the kernel</text><line x1="380.0" y1="100" x2="380.0" y2="480" stroke="#2e2e2b" stroke-width="2"/><rect x="541.3" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="633.3" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >the tracer (bp)</text><line x1="633.3" y1="100" x2="633.3" y2="480" stroke="#2e2e2b" stroke-width="2"/><line x1="129.7" y1="134" x2="376.0" y2="134" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="126.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">executes 0xCC: trap</text><line x1="383.0" y1="174" x2="629.3" y2="174" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="166.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">stop the program, wake the tracer</text><line x1="630.3" y1="214" x2="384.0" y2="214" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="206.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">read registers, restore the byte, rip - 1</text><line x1="630.3" y1="254" x2="384.0" y2="254" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="246.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">PTRACE_SINGLESTEP</text><line x1="377.0" y1="294" x2="130.7" y2="294" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="286.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">run exactly one instruction</text><line x1="129.7" y1="334" x2="376.0" y2="334" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="326.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">trap again</text><line x1="383.0" y1="374" x2="629.3" y2="374" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="366.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">wake the tracer</text><line x1="630.3" y1="414" x2="384.0" y2="414" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="406.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">write 0xCC back, PTRACE_CONT</text><line x1="377.0" y1="454" x2="130.7" y2="454" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="446.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">resume</text><text x="24.0" y="512.0" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#8f8e86" text-anchor="start" font-weight="normal" >measured: 14,637 ns per hit (results/mechanisms/08-cost.txt)</text></svg>