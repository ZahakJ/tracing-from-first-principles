h)"/><text x="506.7" y="166.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">stop 1, on the way in: wake strace</text><line x1="630.3" y1="214" x2="384.0" y2="214" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="206.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">read registers, PTRACE_SYSCALL</text><rect x="263.4" y="236" width="233.2" height="27" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/><text x="380.0" y="254.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="normal" >the kernel does the work</text><line x1="383.0" y1="294" x2="629.3" y2="294" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="286.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">stop 2, on the way out: wake strace</text><line x1="630.3" y1="334" x2="384.0" y2="334" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="326.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">read registers, PTRACE_SYSCALL</text><line x1="377.0" y1="374" x2="130.7" y2="374" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="366.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">back to the program</text><text x="24.0" y="432.0" font-family="DejaVu San