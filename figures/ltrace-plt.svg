<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342"><rect width="760" height="342" rx="10" fill="#1a1a19"/><text x="24.0" y="34.0" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#ffffff" text-anchor="start" font-weight="bold" >A call into a shared library</text><text x="24.0" y="58.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#8f8e86" text-anchor="start" font-weight="normal" >every call to strlen, from anywhere in the program, passes through one stub</text><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#c3c2b7"/></marker></defs><rect x="34.7" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="126.7" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >main()</text><line x1="126.7" y1="100" x2="126.7" y2="320" stroke="#2e2e2b" stroke-width="2"/><rect x="288.0" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="380.0" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >strlen@plt (the stub)</text><line x1="380.0" y1="100" x2="380.0" y2="320" stroke="#2e2e2b" stroke-width="2"/><rect x="541.3" y="74" width="184" height="26" rx="5" fill="#2e2e2b"/><text x="633.3" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" >strlen in libc</text><line x1="633.3" y1="100" x2="633.3" y2="320" stroke="#2e2e2b" stroke-width="2"/><line x1="129.7" y1="134" x2="376.0" y2="134" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="253.3" y="126.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">call 1050 &lt;strlen@plt&gt;</text><rect x="228.2" y="156" width="303.6" height="27" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/><text x="380.0" y="174.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="normal" >first byte ff -&gt; cc under ltrace</text><line x1="383.0" y1="214" x2="629.3" y2="214" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="506.7" y="206.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">jmp *pointer (set by the dynamic linker)</text><rect x="534.3" y="236" width="198.0" height="27" rx="5" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/><text x="633.3" y="254.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="normal" >the real strlen runs</text><line x1="630.3" y1="294" x2="130.7" y2="294" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ah)"/><text x="380.0" y="286.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c3c2b7" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round">ret, straight back to main</text></svg>