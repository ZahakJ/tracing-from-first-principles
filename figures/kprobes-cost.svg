<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434"><rect width="760" height="434" rx="10" fill="#1a1a19"/><text x="24.0" y="34.0" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#ffffff" text-anchor="start" font-weight="bold" >What it costs to stop at one instruction</text><text x="24.0" y="58.0" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#8f8e86" text-anchor="start" font-weight="normal" >added nanoseconds per hit, log scale; who handles the event decides the price</text><line x1="449.0" y1="74" x2="449.0" y2="394" stroke="#2e2e2b" stroke-width="1"/><text x="449.0" y="414.0" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8f8e86" text-anchor="middle" font-weight="normal" >10 ns</text><line x1="498.8" y1="74" x2="498.8" y2="394" stroke="#2e2e2b" stroke-width="1"/><text x="498.8" y="414.0" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8f8e86" text-anchor="middle" font-weight="normal" >100 ns</text><line x1="548.5" y1="74" x2="548.5" y2="394" stroke="#2e2e2b" stroke-width="1"/><text x="548.5" y="414.0" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8f8e86" text-anchor="middle" font-weight="normal" >1 µs</text><line x1="598.2" y1="74" x2="598.2" y2="394" stroke="#2e2e2b" stroke-width="1"/><text x="598.2" y="414.0" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8f8e86" text-anchor="middle" font-weight="normal" >10 µs</text><line x1="648.0" y1="74" x2="648.0" y2="394" stroke="#2e2e2b" stroke-width="1"/><text x="648.0" y="414.0" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8f8e86" text-anchor="middle" font-weight="normal" >100 µs</text><text x="433.0" y="102.5" font-family="DejaVu Sans, sans-serif" font-size="16.5" fill="#c3c2b7" text-anchor="end" font-weight="normal" >compiler-inserted hooks</text><line x1="449" y1="97.0" x2="477.8" y2="97.0" stroke="#3987e5" stroke-width="2" opacity="0.45"/><circle cx="477.8" cy="97.0" r="6" fill="#3